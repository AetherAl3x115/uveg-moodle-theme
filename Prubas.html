  <script>
    (function() {
      const saved  = localStorage.getItem('uveg-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme  = (saved === 'dark' || saved === 'light') ? saved : system;
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>

    .mod-status2 {
  display: inline-flex;
  align-items: center;

  font-size: 11px;

  color: var(--color-accent);
background: rgba(234, 0, 0, 0.25);
  border: .5px solid var(--color-act-video-text);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

.mod-status3{

<body>
    
<div class="shell">

       Atributos configurables:
         user-name      → nombre completo del alumno
         user-role      → rol en la plataforma
         user-initials  → iniciales para el avatar (máx 2 chars)
         active-item    → item activo al cargar (dashboard|modulos|cursos|mensajes|perfil|config)

    user-role="Administrador"
